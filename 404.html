<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Void | PolyNode</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="icon" type="image/png" href="./assets/logo.png">

    <meta name="title" content="404 - Page Not Found | PolyNode">
    <meta name="description" content="The node you requested has been absorbed into the void. Return to PolyNode.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://polynode.link/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://polynode.link/">
    <meta property="og:title" content="404 - Lost in the Void | PolyNode">
    <meta property="og:description" content="This node has been absorbed into the void. Return to PolyNode.">
    <meta property="og:image" content="https://polynode.link/assets/og-image.jpeg">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://polynode.link/">
    <meta property="twitter:title" content="404 - Lost in the Void | PolyNode">
    <meta property="twitter:description" content="This node has been absorbed into the void.">
    <meta property="twitter:image" content="https://polynode.link/assets/og-image.jpeg">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'sans-serif'] },
                    colors: {
                        poly: {
                            bg: '#05050A',
                            accent: '#00D2FF',
                            accent2: '#3A7BD5',
                            muted: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="antialiased">

    <div id="app" class="relative min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 overflow-hidden">

        <!-- Abstract Geometric Narrative Background -->
        <div class="fixed inset-0 pointer-events-none z-0">
            <div v-for="node in floatingNodes" :key="node.id"
                 class="absolute rounded-full mix-blend-screen filter blur-3xl opacity-20 floating-node"
                 :style="{
                     left: node.x + '%',
                     top: node.y + '%',
                     width: node.size + 'px',
                     height: node.size + 'px',
                     backgroundColor: node.color,
                     animationDuration: node.duration + 's',
                     animationDelay: node.delay + 's'
                 }">
            </div>

            <!-- Abstract Grid Lines -->
            <div class="absolute inset-0 abstract-grid opacity-[0.03]"></div>
        </div>

        <header class="w-full max-w-5xl flex justify-between items-center z-10 py-4">
            <div class="flex items-center gap-2">
                <img src="./assets/logo.png" alt="PolyNode Logo" class="w-8 h-8">
                <span class="font-bold text-xl tracking-tighter">PolyNode.link</span>
            </div>
        </header>

        <main class="z-10 flex flex-col items-center text-center max-w-4xl mt-12 md:mt-16 w-full">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass border border-white/10 text-[9px] sm:text-[10px] uppercase tracking-widest font-bold text-poly-muted mb-8">
                <span class="relative flex h-2 w-2">
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-poly-muted"></span>
                </span>
                Node Not Found
            </div>

            <h1 class="text-7xl sm:text-9xl md:text-[10rem] font-extrabold tracking-tighter mb-4 leading-none">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-poly-accent to-poly-accent2">404</span>
            </h1>

            <h2 class="text-2xl sm:text-4xl md:text-5xl font-bold mb-6 text-white tracking-tight">
                Lost in the void.
            </h2>

            <p class="text-base sm:text-lg md:text-xl text-poly-muted mb-12 max-w-2xl leading-relaxed font-medium px-4">
                The node you requested has been absorbed into the void. It was either encrypted, deleted, or never existed in this topology.
            </p>

            <a href="./"
               class="btn-premium w-full sm:w-auto px-8 sm:px-10 py-4 rounded-2xl font-bold text-poly-bg text-base sm:text-lg inline-flex items-center justify-center tracking-wide cursor-pointer">
                Return to Origin
            </a>
        </main>

        <footer class="z-10 w-full flex justify-center py-8 sm:py-10 opacity-40 hover:opacity-100 transition-opacity">
            <p class="text-[10px] sm:text-xs font-medium tracking-widest uppercase text-center">Built for Performance • by serqux <b>(aka `a8kj7sea`)</b> • 2026</p>
        </footer>

    </div>

    <script src="./js/404.js"></script>
</body>

</html>
